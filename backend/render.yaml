services:
  - type: web
    name: ai-data-analyst-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/analyst.db
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: data
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
